<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>불씨체크 | 안전 점검</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#202638;font-family:Arial,sans-serif}
header{background:#b91c1c;color:white;padding:24px 20px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:25px}
main{max-width:600px;margin:auto;padding:20px}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:15px}
h2{font-size:19px}
.item{padding:14px 0;border-bottom:1px solid #eee}
.item:last-child{border:0}
label{display:flex;justify-content:space-between;align-items:center;gap:8px}
select{padding:9px;border:1px solid #ddd;border-radius:8px;background:white}
input,select{font-size:14px}
input[type=text]{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px}
button{width:100%;padding:15px;background:#b91c1c;color:white;border:0;border-radius:10px;font-size:16px;font-weight:bold;margin-top:15px}
nav{display:flex;gap:8px;margin-top:20px}
nav a{flex:1;text-align:center;padding:12px 5px;background:white;border-radius:10px;text-decoration:none;color:#333;font-size:13px}
#result{font-weight:bold;color:#b91c1c;text-align:center;margin-top:15px}
</style>
</head>
<body>
<header>
<h1>🧯 안전 점검</h1>
<p>우리 주변의 화재 위험 요소를 확인하세요.</p>
</header>
<main>
<div class="card">
<h2>점검 장소</h2>
<input type="text" id="place" placeholder="예: 우리 집, 교실">
</div>
<div class="card">
<h2>화재 안전 점검표</h2>
<p>각 항목의 상태를 선택해 주세요.</p>

<div class="item">
<label>🧯 소화기가 비치되어 있나요?
<select class="status"><option value="양호">양호</option><option value="확인 필요">확인 필요</option></select>
</label>
</div>

<div class="item">
<label>🚪 비상구 주변이 비어 있나요?
<select class="status"><option value="양호">양호</option><option value="확인 필요">확인 필요</option></select>
</label>
</div>

<div class="item">
<label>🔌 전기시설에 이상이 없나요?
<select class="status"><option value="양호">양호</option><option value="확인 필요">확인 필요</option></select>
</label>
</div>

<div class="item">
<label>🚨 화재감지기가 정상인가요?
<select class="status"><option value="양호">양호</option><option value="확인 필요">확인 필요</option></select>
</label>
</div>

<button onclick="saveCheck()">점검 결과 저장하기</button>
<p id="result"></p>
</div>

<nav>
<a href="index.html">🏠 홈</a>
<a href="check.html">📝 안전 점검</a>
<a href="history.html">📋 기록 확인</a>
</nav>
</main>

<script>
function saveCheck(){
const place=document.getElementById('place').value.trim();
if(!place){
alert('점검 장소를 입력해 주세요.');
return;
}
const values=[...document.querySelectorAll('.status')].map(x=>x.value);
const good=values.filter(x=>x==='양호').length;
const record={
id:Date.now(),
date:new Date().toLocaleString('ko-KR'),
place:place,
fire:values[0],
exit:values[1],
electric:values[2],
detector:values[3],
score:good,
state:good===4?'안전':'점검 필요'
};
let records=JSON.parse(localStorage.getItem('fireChecks')||'[]');
records.push(record);
localStorage.setItem('fireChecks',JSON.stringify(records));
document.getElementById('result').textContent=
'점검 완료! 양호 항목 '+good+'/4개. '+record.state;
fetch('https://script.google.com/macros/s/AKfycbwEo5L5hP930tR3Z1xgwFW36CKHH6bQcDSyLmZ3csxTBkQVNUBoPzqG3L_0hLitEi_VXg/exec',{
method:'POST',
mode:'no-cors',
headers:{
'Content-Type':'text/plain'
},
body:JSON.stringify(record)
});
}
</script>
</body>
</html>
